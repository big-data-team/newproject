name: CI

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Run tests
      run: uv run pytest -v tests/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Build package
      run: uv build
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: newproject_eadishchev
        path: dist/*
