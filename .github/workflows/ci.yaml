name: CI

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Run tests
      run: uv run pytest -v tests/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Build package
      run: uv build
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: newproject_eadishchev
        path: dist/*
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: newproject_eadishchev
        path: dist/
    - name: Publish package
      run: >-
        uv publish --publish-url https://test.pypi.org/legacy/
        --check-url https://test.pypi.org/simple/ dist/*
      env:
        UV_PUBLISH_USERNAME: __token__
        UV_PUBLISH_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
